<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Staser - Static Server</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <header>
      <h1 id="header">Directory listing</h1>
      <nav id="controls">
        <button id="upButton" hidden>Directory Up</button>
        <button id="downloadAll">Download All</button>

        <input type="file" id="file" name="file" />
        <label for="file" id="uploadLabel">Upload File</label>

        <div id="loader" hidden>Loading…</div>
      </nav>
    </header>

    <main>
      <ul id="listing" role="list"></ul>
    </main>

    <div id="alert" role="status"></div>

    <script src="app.js" defer></script>
  </body>
</html>
